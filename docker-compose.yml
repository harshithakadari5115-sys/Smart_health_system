version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: healthflow_db
    environment:
      POSTGRES_USER: healthflow
      POSTGRES_PASSWORD: healthflow_secure_password
      POSTGRES_DB: healthflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: healthflow_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthflow_backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://healthflow:healthflow_secure_password@postgres:5432/healthflow
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your_jwt_secret_key_here
      AI_API_KEY: your_ai_api_key_here
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: healthflow_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000/api
    ports:
      - "3001:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: healthflow_network
